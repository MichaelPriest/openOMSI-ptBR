name: Build openOMSI pt-BR Windows x64

on:
  push:
    branches:
      - ptbr/latest
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-ptbr:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ptbr-x64

      - name: Apply Brazilian Portuguese pack
        shell: pwsh
        run: |
          $b64 = (Get-Content tools/ptbr-pack.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes("ptbr-pack.zip", [Convert]::FromBase64String($b64))
          Expand-Archive ptbr-pack.zip -DestinationPath ptbr-pack -Force
          python ptbr-pack/install_ptbr.py .
          Select-String -Path crates/omsi-app/locales/app.yml -Pattern 'pt-BR:' | Select-Object -First 5
          Select-String -Path crates/omsi-app/src/tutorial.rs -Pattern 'ptbr_translate'

      - name: Build Windows x64
        shell: cmd
        run: scripts\build-windows.cmd x86_64-pc-windows-msvc

      - name: DirectX shader compiler
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D dxc
          $zip = Get-ChildItem dxc/*.zip | Where-Object { $_.Name -notmatch "linux|pdb" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc/x
          Copy-Item "dxc/x/bin/x64/dxcompiler.dll", "dxc/x/bin/x64/dxil.dll" dist/windows/

      - name: Package pt-BR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md, LICENSE dist/windows/
          @"
          openOMSI - Português (Brasil)
          Commit: $env:GITHUB_SHA
          Idioma: PTB / pt-BR
          Inclui tradução da interface e fallback pt-BR para páginas dos tutoriais originais.
          "@ | Set-Content -Encoding UTF8 dist/windows/PT-BR-BUILD.txt
          Compress-Archive -Path dist/windows/* -DestinationPath out/openOMSI-latest-windows-x64-ptBR.zip
          Get-FileHash out/openOMSI-latest-windows-x64-ptBR.zip -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: openOMSI-latest-windows-x64-ptBR
          path: out/openOMSI-latest-windows-x64-ptBR.zip
          if-no-files-found: error
