name: Package Empresa Virtual test plugin
on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/empresa_virtual/**"
      - ".github/workflows/empresa-virtual-package.yml"
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Validate package structure and Lua syntax
        run: |
          luac5.4 -p plugins/empresa_virtual/main.lua
          luac5.4 -p plugins/empresa_virtual/compat.lua
          luac5.4 -p tests/empresa_virtual_smoke.lua
          lua5.4 tests/empresa_virtual_smoke.lua
          test -f plugins/empresa_virtual/main.lua
          test -f plugins/empresa_virtual/compat.lua
          test -f plugins/empresa_virtual/README.md
          test -f plugins/empresa_virtual/plugin.json
          grep -q 'compat.startup' plugins/empresa_virtual/main.lua
      - name: Create portable ZIP
        run: |
          mkdir -p dist
          zip -r dist/empresa-virtual-openomsi-test.zip plugins/empresa_virtual
          sha256sum dist/empresa-virtual-openomsi-test.zip > dist/empresa-virtual-openomsi-test.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: empresa-virtual-openomsi-test
          path: |
            dist/empresa-virtual-openomsi-test.zip
            dist/empresa-virtual-openomsi-test.zip.sha256
          if-no-files-found: error
